<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Objem</title>
  <style>
    @font-face {
      font-family: "Fenomen Sans";
      src: url("https://jjpiguuubvmiobmixwgh.supabase.co/storage/v1/object/public/Admin%20math/Fenomen%20Sans%20Book.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fenomen Sans";
      src: url("https://jjpiguuubvmiobmixwgh.supabase.co/storage/v1/object/public/Admin%20math/Fenomen%20Sans%20Book.otf") format("opentype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fenomen Sans";
      src: url("https://jjpiguuubvmiobmixwgh.supabase.co/storage/v1/object/public/Admin%20math/Fenomen%20Sans%20Book.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --panel-w: min(300px, max(260px, 26vw), calc(100vw - 16px));
      --font-app: "Fenomen Sans", ui-sans-serif, system-ui, sans-serif;
      --bg: #f4f5f8;
      --panel-bg: #ffffff;
      --text: #171923;
      --muted: #6b7280;
      --accent: #3d5a9a;
      --accent-hover: #334b81;
      --accent-soft: #eef2f8;
      --border: #e8eaef;
      --area-muted: #eceff5;
      --readout-bg: #f4f5f8;
      --success: #059669;
      --danger: #dc2626;
      --success-bg: rgb(236 253 245 / 0.92);
      --danger-bg: rgb(254 242 242 / 0.92);
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-app);
      color-scheme: light;
      overflow: hidden;
    }

    button, input, select {
      font-family: var(--font-app);
    }

    .app-root {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 8px;
      background: var(--bg);
      overflow: hidden;
    }

    .left-panel {
      position: fixed;
      inset: 8px auto 8px 8px;
      z-index: 100;
      width: var(--panel-w);
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--panel-bg);
      box-shadow: 0 12px 32px rgba(23, 25, 35, 0.06);
    }

    .left-panel > * {
      min-width: 0;
      max-width: 100%;
    }

    [hidden] {
      display: none !important;
    }

    .app-root[data-app-mode="cuboid"] #free-panel,
    .app-root[data-app-mode="free"] #cuboid-panel,
    .app-root[data-app-mode="free"] #new-cuboid-btn {
      display: none !important;
    }

    .zoom-bar {
      display: grid;
      gap: 10px;
    }

    .zoom-controls {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 10px;
    }

    .canvas-pan-toggle {
      box-sizing: border-box;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-bg);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      font-size: 0.8rem;
      line-height: 1.15;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s, transform 0.08s;
    }

    .canvas-pan-toggle:hover {
      border-color: var(--accent);
    }

    .canvas-pan-toggle:active {
      transform: translateY(1px);
    }

    .canvas-pan-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .canvas-pan-toggle.is-pressed {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .canvas-pan-toggle.is-pressed:hover {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    .canvas-pan-toggle__icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: block;
    }

    .canvas-pan-toggle__label {
      min-width: 0;
    }

    .board-pan-catch {
      position: absolute;
      inset: 0;
      z-index: 60;
      cursor: grab;
      touch-action: none;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }

    .board-pan-catch[hidden] {
      display: none !important;
    }

    .board-pan-catch.is-dragging-pan {
      cursor: grabbing;
    }

    .zoom-controls button {
      appearance: none;
      min-height: 44px;
      min-width: 44px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-bg);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
    }

    .zoom-controls button:hover {
      border-color: var(--accent);
    }

    .zoom-controls button:active {
      transform: translateY(1px);
    }

    .zoom-controls button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .zoom-controls button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    #zoom-slider {
      width: 100%;
      height: 6px;
      min-width: 0;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 999px;
      background: var(--area-muted);
      outline: none;
    }

    #zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid var(--accent);
      cursor: pointer;
    }

    #zoom-slider::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: var(--area-muted);
    }

    #zoom-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .panel-copy {
      display: grid;
      gap: 12px;
      padding: 18px 18px 0;
    }

    .panel-title {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: var(--area-muted);
    }

    .mode-switch__btn {
      appearance: none;
      min-height: 40px;
      padding: 8px 10px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
    }

    .mode-switch__btn:hover { color: var(--text); }
    .mode-switch__btn:active { transform: translateY(1px); }
    .mode-switch__btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .mode-switch__btn.is-active {
      background: var(--panel-bg);
      color: var(--text);
      box-shadow: 0 1px 3px rgb(23 25 35 / 0.1);
    }

    .control-panel {
      display: grid;
      gap: 14px;
      padding: 14px 18px 18px;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      min-width: 0;
      flex: 0 1 auto;
    }

    .panel-section {
      display: grid;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }

    .panel-label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .panel-text {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .action-btn {
      appearance: none;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-bg);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
      max-width: 100%;
    }

    .action-btn:hover:not(:disabled) { border-color: var(--accent); }
    .action-btn:active:not(:disabled) { transform: translateY(1px); }
    .action-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .action-btn--primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .action-btn--primary:hover:not(:disabled) {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    .dim-input-stack {
      display: grid;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }

    .dim-input-line {
      display: grid;
      grid-template-columns: 4.5rem minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }

    .dim-input-line__label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
    }

    .step-input {
      display: flex;
      align-items: stretch;
      min-width: 0;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--readout-bg);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .step-input:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 90, 154, 0.12);
    }

    .step-value {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .step-input input[type="number"] {
      width: 100%;
      min-width: 0;
      padding: 8px 4px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .step-input input[type="number"]::-webkit-inner-spin-button,
    .step-input input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .step-input input[type="number"]:focus {
      outline: none;
    }

    .step-spin {
      flex-shrink: 0;
      width: 1.55rem;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
    }

    .step-btn {
      flex: 1 1 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: var(--panel-bg);
      color: var(--muted);
      padding: 0;
      font-size: 0.62rem;
      line-height: 1;
      cursor: pointer;
      min-height: 0;
      font-weight: 400;
      -webkit-tap-highlight-color: transparent;
    }

    .step-btn:hover:not(:disabled) {
      background: var(--area-muted);
      color: var(--text);
    }

    .step-btn:active:not(:disabled) {
      background: var(--border);
    }

    .step-btn + .step-btn {
      border-top: 1px solid var(--border);
    }

    .step-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .step-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .dim-unit {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
    }

    .indicator-answer {
      display: grid;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }

    .indicator-answer-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
      width: 100%;
      min-width: 0;
    }

    .indicator-answer-row .indicator-answer-field {
      flex: 1 1 auto;
    }

    .indicator-answer-row #verify-btn {
      width: auto;
      flex: 0 0 auto;
      align-self: stretch;
      padding-left: 16px;
      padding-right: 16px;
      white-space: nowrap;
    }

    .indicator-answer-field {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      min-height: 46px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      padding: 8px 10px;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .indicator-answer-field input,
    .indicator-answer-field select {
      border: none;
      background: transparent;
      font: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      outline: none;
    }

    .indicator-answer-field input {
      flex: 1;
      min-width: 0;
      text-align: right;
    }

    .indicator-answer-field select {
      flex: 0 1 auto;
      max-width: 4.5rem;
      min-width: 0;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .indicator-answer-row.is-correct .indicator-answer-field {
      border-color: color-mix(in srgb, var(--success) 55%, var(--border));
      background: var(--success-bg);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.08);
    }

    .indicator-answer-row.is-wrong .indicator-answer-field {
      border-color: color-mix(in srgb, var(--danger) 40%, var(--border));
      background: var(--danger-bg);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.06);
    }

    .indicator-answer-feedback {
      min-height: 1.1em;
      font-size: 0.82rem;
      font-weight: 650;
      color: var(--muted);
    }

    .indicator-answer-field input.app-numeric-input {
      cursor: pointer;
    }

    .indicator-answer-feedback.is-correct { color: var(--success); }
    .indicator-answer-feedback.is-wrong { color: var(--danger); }

    .table-keypad-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(15, 23, 42, 0.42);
    }

    .table-keypad-overlay[hidden] {
      display: none !important;
    }

    .table-keypad-panel {
      width: min(100%, 300px);
      padding: 16px;
      border-radius: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      box-shadow: 0 14px 42px rgba(15, 23, 42, 0.22);
      display: grid;
      gap: 12px;
    }

    .table-keypad-panel__title {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 650;
      color: var(--muted);
      text-align: center;
    }

    .table-keypad-panel__display {
      box-sizing: border-box;
      height: 64px;
      min-height: 64px;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--readout-bg);
      font-size: 1.5rem;
      font-weight: 650;
      line-height: 1.2;
      text-align: center;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      white-space: nowrap;
    }

    .table-keypad-panel__display.is-invalid {
      border-color: var(--danger);
      color: var(--danger);
    }

    .table-keypad-panel__error {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 650;
      color: var(--danger);
      text-align: center;
    }

    .table-keypad-panel__error[hidden] {
      display: none !important;
    }

    .table-keypad-panel__actions {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .table-keypad-panel__action {
      appearance: none;
      box-sizing: border-box;
      width: 56px;
      height: 56px;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .table-keypad-panel__action svg {
      display: block;
      flex-shrink: 0;
    }

    .table-keypad-panel__confirm {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(61, 90, 154, 0.35);
    }

    .table-keypad-panel__cancel {
      background: var(--readout-bg);
      color: var(--muted);
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }

    .table-keypad-panel__action:hover {
      filter: brightness(1.05);
    }

    .table-keypad-panel__cancel:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .table-keypad-panel__action:active {
      transform: scale(0.97);
    }

    .table-math-keypad {
      width: 100%;
    }

    .table-math-keypad__grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .table-math-keypad__key {
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--readout-bg);
      color: var(--text);
      font: inherit;
      font-size: 1.125rem;
      font-weight: 650;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .table-math-keypad__key svg {
      display: block;
      flex-shrink: 0;
    }

    .table-math-keypad__key:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--area-muted);
    }

    .table-math-keypad__key:active:not(:disabled) {
      background: rgba(61, 90, 154, 0.12);
    }

    .table-keypad-panel__action:focus-visible,
    .table-math-keypad__key:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .workspace {
      box-sizing: border-box;
      position: relative;
      z-index: 1;
      margin-left: calc(var(--panel-w) + 24px);
      width: calc(100% - var(--panel-w) - 24px);
      height: calc(100dvh - 16px);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 0 0 0 8px;
    }

    .board-stage {
      flex: 1;
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 16px;
    }

    #diagram-wrap {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      transform: translate(var(--board-pan-x, 0px), var(--board-pan-y, 0px))
        scale(var(--board-zoom, 1));
      transform-origin: center center;
      will-change: transform;
    }

    /* Ve volné ploše držíme stejné měřítko krychlí jako v módu kvádr – wrap se nesmí smrštit. */
    [data-app-mode="free"] #diagram-wrap {
      flex: 0 0 auto;
      min-width: auto;
      min-height: auto;
    }

    [data-app-mode="free"] #diagram {
      flex-shrink: 0;
    }

    #diagram {
      display: block;
      touch-action: none;
      user-select: none;
      overflow: visible;
      cursor: grab;
    }

    #diagram.is-dragging {
      cursor: grabbing;
    }

    #cube-stack {
      flex: 1 1 auto;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 12px 18px 20px;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border-top: 1px solid var(--border);
    }

    #cube-stack .stack-small-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex-shrink: 0;
    }

    #cube-stack .stack-cube {
      position: relative;
      touch-action: none;
      user-select: none;
      flex-shrink: 0;
      cursor: grab;
    }

    #cube-stack .stack-cube:active {
      cursor: grabbing;
    }

    #cube-stack .stack-cube[data-type="cm3"] {
      width: calc(var(--stack-cm3-w, 72px) + 16px);
      height: calc(var(--stack-cm3-h, 72px) + 16px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cube-stack .stack-cube[data-type="mm3"] {
      width: var(--stack-mm3-hit, 44px);
      height: var(--stack-mm3-hit, 44px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stack-visual {
      display: block;
      overflow: visible;
      pointer-events: none;
    }

    .stack-visual-cm3 {
      width: var(--stack-cm3-w, 72px);
      height: var(--stack-cm3-h, 72px);
    }

    .stack-visual-mm3 {
      width: var(--stack-mm3-w, 10px);
      height: var(--stack-mm3-h, 10px);
    }

    .stack-label {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 4px);
      transform: translateX(-50%);
      font-size: 0.78rem;
      font-weight: 650;
      white-space: nowrap;
      pointer-events: none;
      line-height: 1;
    }

    .stack-label-cm3 {
      color: #3d5a9a;
    }

    .stack-label-mm3 {
      color: #dc2626;
    }

    .drag-ghost {
      position: fixed;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 400;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drag-ghost .stack-visual {
      width: 100%;
      height: 100%;
    }

    #static-layer,
    #cuboid-hidden-edges,
    #label-layer,
    #cuboid-front-overlay,
    #cuboid-exact,
    #cuboid-exact-labels,
    #cuboid-dynamic,
    #cuboid-dynamic-labels {
      pointer-events: none;
    }

    .placed-cube {
      cursor: grab;
    }

    .placed-cube.is-dragging {
      cursor: grabbing;
    }

    .cube-hit {
      fill: transparent;
      stroke: none;
      pointer-events: all;
    }

    .quiz-celebration {
      position: fixed;
      inset: 0;
      z-index: 250;
      overflow: visible;
      pointer-events: none;
    }

    .quiz-confetti-burst {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
    }

    .quiz-confetti {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--size, 8px);
      height: calc(var(--size, 8px) * 1.2);
      border-radius: 2px;
      opacity: 0.95;
      transform: translate(-50%, -50%);
      animation: quiz-confetti-burst 1.35s ease-out forwards;
    }

    @keyframes quiz-confetti-burst {
      0% {
        transform: translate(-50%, -50%) rotate(0deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(calc(-50% + var(--burst-x)), calc(-50% + var(--burst-y)))
          rotate(var(--rotation)) scale(0.55);
        opacity: 0;
      }
    }

    @media (max-width: 760px) {
      html, body { overflow: auto; }

      .app-root {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 100dvh;
        overflow: auto;
      }

      .left-panel {
        position: relative;
        inset: auto;
        width: 100%;
        max-height: none;
        margin-bottom: 8px;
      }

      .workspace {
        margin-left: 0;
        width: 100%;
        padding: 0;
        height: auto;
        flex: 1;
        min-height: min(52vh, 420px);
      }

      .board-stage {
        flex: 1;
        min-height: min(52vh, 420px);
      }

      .stage {
        flex-direction: column;
        justify-content: center;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app-root" id="app-root" data-app-mode="cuboid">
    <aside class="left-panel" aria-label="Ovládání">
      <div class="panel-copy">
        <h1 class="panel-title">Objem</h1>
        <div class="mode-switch" role="tablist" aria-label="Režim simulace">
          <button
            type="button"
            class="mode-switch__btn is-active"
            id="mode-cuboid-btn"
            data-mode="cuboid"
            role="tab"
            aria-selected="true"
          >
            Kvádr
          </button>
          <button
            type="button"
            class="mode-switch__btn"
            id="mode-free-btn"
            data-mode="free"
            role="tab"
            aria-selected="false"
          >
            Volná plocha
          </button>
        </div>
        <button id="new-cuboid-btn" class="action-btn action-btn--primary" type="button">Nový kvádr</button>
      </div>

      <div class="control-panel" id="cuboid-panel">
        <div class="panel-section">
          <span class="panel-label">Rozměry</span>
          <div class="dim-input-stack">
            <div class="dim-input-line">
              <span class="dim-input-line__label">Šířka</span>
              <div class="step-input">
                <div class="step-value">
                  <input id="cuboid-width" type="number" min="1" step="1" inputmode="numeric" aria-label="Šířka v cm" />
                </div>
                <span class="step-spin">
                  <button type="button" class="step-btn step-up" data-dim-input="cuboid-width" aria-label="Zvětšit šířku o 1 cm">▲</button>
                  <button type="button" class="step-btn step-down" data-dim-input="cuboid-width" aria-label="Zmenšit šířku o 1 cm">▼</button>
                </span>
              </div>
              <span class="dim-unit">cm</span>
            </div>
            <div class="dim-input-line">
              <span class="dim-input-line__label">Hloubka</span>
              <div class="step-input">
                <div class="step-value">
                  <input id="cuboid-depth" type="number" min="1" step="1" inputmode="numeric" aria-label="Hloubka v cm" />
                </div>
                <span class="step-spin">
                  <button type="button" class="step-btn step-up" data-dim-input="cuboid-depth" aria-label="Zvětšit hloubku o 1 cm">▲</button>
                  <button type="button" class="step-btn step-down" data-dim-input="cuboid-depth" aria-label="Zmenšit hloubku o 1 cm">▼</button>
                </span>
              </div>
              <span class="dim-unit">cm</span>
            </div>
            <div class="dim-input-line">
              <span class="dim-input-line__label">Výška</span>
              <div class="step-input">
                <div class="step-value">
                  <input id="cuboid-height" type="number" min="1" step="1" inputmode="numeric" aria-label="Výška v cm" />
                </div>
                <span class="step-spin">
                  <button type="button" class="step-btn step-up" data-dim-input="cuboid-height" aria-label="Zvětšit výšku o 1 cm">▲</button>
                  <button type="button" class="step-btn step-down" data-dim-input="cuboid-height" aria-label="Zmenšit výšku o 1 cm">▼</button>
                </span>
              </div>
              <span class="dim-unit">cm</span>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <span class="panel-label">Objem kvádru</span>
          <div class="indicator-answer">
            <div class="indicator-answer-row" id="volume-answer-row">
              <div class="indicator-answer-field">
                <input
                  id="volume-value"
                  class="app-numeric-input"
                  type="text"
                  inputmode="none"
                  readonly
                  aria-label="Hodnota objemu"
                />
                <select id="volume-unit" aria-label="Jednotka objemu">
                  <option value="cm3">cm³</option>
                  <option value="mm3">mm³</option>
                </select>
              </div>
              <button id="verify-btn" class="action-btn action-btn--primary" type="button">Ověřit</button>
            </div>
            <p class="indicator-answer-feedback" id="volume-feedback" aria-live="polite"></p>
          </div>
        </div>
      </div>

      <div class="control-panel" id="free-panel" hidden>
        <div class="zoom-bar" role="toolbar" aria-label="Přiblížení plochy">
          <span class="panel-label" id="zoom-heading">Přiblížení</span>
          <span id="zoom-slider-label" class="sr-only">Měřítko plochy v procentech</span>
          <div class="zoom-controls">
            <button type="button" id="zoom-out-btn" aria-label="Oddálit">−</button>
            <input
              type="range"
              id="zoom-slider"
              min="100"
              max="300"
              step="10"
              value="100"
              aria-labelledby="zoom-heading zoom-slider-label"
            />
            <button type="button" id="zoom-in-btn" aria-label="Přiblížit">+</button>
          </div>
          <button
            type="button"
            id="canvas-pan-toggle"
            class="canvas-pan-toggle"
            aria-pressed="false"
            aria-label="Pohybovat s plátnem — zapíná režim přetahování celého plátna"
          >
            <svg
              class="canvas-pan-toggle__icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                d="M18 11V6a2 2 0 00-2-2 2 2 0 00-2 2M14 10V4a2 2 0 00-2-2 2 2 0 00-2 2v2M10 10.5V6a2 2 0 00-2-2 2 2 0 00-2 2v8a8 8 0 008 8h2c2.8 0 4.5-.86 5.99-2.34l1.41-1.41a2 2 0 00-2.83-2.82L15 15"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="canvas-pan-toggle__label">Pohybovat s plátnem</span>
          </button>
        </div>
      </div>

      <div id="cube-stack" aria-label="Zásobník krychlí">
        <div class="stack-cube" data-type="cm3" role="button" tabindex="0" aria-label="1 cm³">
          <svg class="stack-visual stack-visual-cm3" viewBox="20.5 21 40.3 40" aria-hidden="true">
            <path d="M50.3127 61H20.5L20.6498 31.1873L30.8371 21H60.7996V50.6629L50.3127 61Z" fill="#d7e0f4"/>

            </svg>
            <span class="stack-label stack-label-mm3">1 mm³</span>
          </div>
        </div>
      </div>
    </aside>

  <div id="volume-keypad-overlay" class="table-keypad-overlay" hidden>
    <div class="table-keypad-panel" role="dialog" aria-modal="true" aria-labelledby="volume-keypad-title">
      <p id="volume-keypad-title" class="table-keypad-panel__title">Objem kvádru</p>
      <div id="volume-keypad-display" class="table-keypad-panel__display" aria-live="polite"></div>
      <p id="volume-keypad-error" class="table-keypad-panel__error" hidden></p>
      <div class="table-math-keypad" id="volume-math-keypad" aria-label="Matematická klávesnice">
        <div class="table-math-keypad__grid">
          <button class="table-math-keypad__key" type="button" data-value="7">7</button>

          <button class="table-math-keypad__key" type="button" data-value="5">5</button>

          <button class="table-math-keypad__key" type="button" data-value="2">2</button>

              <path

                stroke-width="2"
                stroke-linecap="round"

            </svg>

  </div>
